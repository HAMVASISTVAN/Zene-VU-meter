<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Zenelejátszó</title>
    
<style>
    .zenepanel {
        width: 520px;
        padding: 15px;
        border: 1px solid #aaa;
        border-radius: 10px;
        background-color: #f2f2f2;
    }

    .zenesor {
        padding: 8px;
        margin-bottom: 8px;
        background-color: white;
        border-radius: 5px;
    }

    .zenesor button {
        width: 120px;
        padding: 6px;
        cursor: pointer;
    }
    .zenesor.aktiv {
    background-color: #cceeff;
    border: 1px solid #3399cc;
}
</style>

</head>
<body>
    <h1>MSZC Gépészeti Technikum és Kollégium</h1>    
      <h3>Szoftverfejlesztő -és tesztelő csoport</h3>
   <audio id="lejatszo" controls crossorigin="anonymous"></audio>
    <br><br>    
<div class="zenepanel">

    <div class="zenesor">
        <button id="zene1">▶ Lejátszás</button>
        <span>Falco – Der Kommissar (1982)</span>
    </div>

    <div class="zenesor">
        <button id="zene2">▶ Lejátszás</button>
        <span>Alphaville – Elevator (1983)</span>
    </div>

    <div class="zenesor">
        <button id="zene3">▶ Lejátszás</button>
        <span>16 BIT – Where Are You (1987)</span>
    </div>

</div>
    <br><br>
    <canvas id="vuMeter" width="500" height="100"></canvas>
    <script>
        let balHossz = 20;
        let jobbHossz = 20;  
        let balCsucs = 0;  // Bal csatorna hangerőcsúcsa
        let jobbCsucs = 0; // Jobb csatorna hangerőcsúcsa
        let irany = 1;
        let balIrany = 1;
        let jobbIrany = 1; 
        let szamlalo = 0;
        let lejatszo = document.getElementById("lejatszo"); // Ez az <audio> elemet jelenti        
        let audioContext = new AudioContext();             // létrehoz egy Web Audio rendszert a böngészőben  
        let forras = audioContext.createMediaElementSource(lejatszo);  // A lejátszó hangját szeretném betáplálni a Web Audio rendszerbe    
        let analizalo = audioContext.createAnalyser();
       
        // balAnalizalo.fftSize  = 256;
       // jobbAnalizalo.fftSize = 256;  // az analizáló a hangból számokat fog készíteni
       // let adatok = new Uint8Array(analizalo.frequencyBinCount);
         analizalo.fftSize = 256;
         let splitter = audioContext.createChannelSplitter(2);
        forras.connect(splitter);
        forras.connect(analizalo);
        analizalo.connect(audioContext.destination);  // hogy hangot is adjon

       
        
        let balAnalizalo = audioContext.createAnalyser();
        let jobbAnalizalo = audioContext.createAnalyser();
        balAnalizalo.fftSize = 256;
        jobbAnalizalo.fftSize = 256;   

        let balAdatok = new Uint8Array(balAnalizalo.frequencyBinCount);
        let jobbAdatok = new Uint8Array(jobbAnalizalo.frequencyBinCount);
       

       splitter.connect(balAnalizalo, 0);
       splitter.connect(jobbAnalizalo, 1);
        

        let zene1 = document.getElementById("zene1");
        let zene2 = document.getElementById("zene2");
        let zene3 = document.getElementById("zene3");
        let canvas = document.getElementById("vuMeter");
        let ctx = canvas.getContext("2d");

        
zene1.addEventListener("click", function() {
    audioContext.resume();
    // Az összes zenesor kijelölését töröljük
    document.querySelectorAll(".zenesor").forEach(function(sor) {
        sor.classList.remove("aktiv");
    });
    // A kiválasztott zenesor kiemelése
    zene1.parentElement.classList.add("aktiv");
    lejatszo.src = "/zene1";
    lejatszo.play();
});

       
zene2.addEventListener("click", function() {
    audioContext.resume();
    // Az összes zenesor kijelölését töröljük
    document.querySelectorAll(".zenesor").forEach(function(sor) {
        sor.classList.remove("aktiv");
    });
    // A kiválasztott zenesor kiemelése
    zene2.parentElement.classList.add("aktiv");
    lejatszo.src = "/zene2";
    lejatszo.play();
});

       zene3.addEventListener("click", function() {
    audioContext.resume();
    // Az összes zenesor kijelölését töröljük
    document.querySelectorAll(".zenesor").forEach(function(sor) {
        sor.classList.remove("aktiv");
    });
    // A kiválasztott zenesor kiemelése
    zene3.parentElement.classList.add("aktiv");
    lejatszo.src = "/zene3";
    lejatszo.play();
});
       // Betű beállítása
ctx.font = "20px Arial";
// L felirat
ctx.fillText("L", 2, 37);
// L sáv
ctx.fillRect(20, 20, balHossz, 20);
// R felirat
ctx.fillText("R", 2, 77);
// R sáv
ctx.fillRect(20, 60, jobbHossz, 20);
function frissit() {
   
    balAnalizalo.getByteFrequencyData(balAdatok);
    jobbAnalizalo.getByteFrequencyData(jobbAdatok);
    let balOsszeg = 0;
    let jobbOsszeg = 0;
    // balHossz = balAdatok[0];
    // jobbHossz = jobbAdatok[0];
    // console.log(balAdatok);

    for (let i = 0; i < 128; i++) {
    balOsszeg = balOsszeg + balAdatok[i];
    jobbOsszeg = jobbOsszeg + jobbAdatok[i];
}

balHossz  = balOsszeg  / 128 * 2.0;
jobbHossz = jobbOsszeg / 128 * 2.0;
// A hangerőcsúcs frissítése
balCsucs = Math.max(balHossz, balCsucs - 0.5);
jobbCsucs = Math.max(jobbHossz, jobbCsucs - 0.5);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

   
    

    // Sávok kirajzolása
   // Aktuális hangerő megjelenítése kék színnel
   // Az aktuális hangerő kirajzolása kék színnel
ctx.fillStyle = "blue";
ctx.fillRect(20, 20, balHossz, 20);
ctx.fillRect(20, 60, jobbHossz, 20);

// A hangerőcsúcs jelölése piros vonallal
ctx.fillStyle = "red";
ctx.fillRect(20 + balCsucs, 20, 6, 20);
ctx.fillRect(20 + jobbCsucs, 60, 6, 20);

    // Aktuális érték kiírása
//ctx.fillText(Math.round(balHossz), 300, 37);
//ctx.fillText(Math.round(jobbHossz), 300, 77);

    requestAnimationFrame(frissit);}

frissit();
    </script>
</body>
</html>
